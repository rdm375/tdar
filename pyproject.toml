[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdar"
version = "0.2.0"
description = "Taylor-Disagreement Adaptive Refinement (TDAR) for 2-D surrogate sampling"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
jax = ["jax>=0.4"]
test = ["pytest>=7"]
viz = ["matplotlib>=3.7", "pillow>=10"]
benchmark = ["matplotlib>=3.7", "jax>=0.4"]
dev = ["pytest>=7", "matplotlib>=3.7", "pillow>=10", "jax>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
